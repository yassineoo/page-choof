<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ooredoo Offers Section</title>
    <meta name="description" content="Standalone Ooredoo offers section rendered with plain HTML, CSS, and JavaScript." />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-section" aria-labelledby="ooredoo-title">
        <div class="section-header">
          <div class="eyebrow">Standalone preview</div>
          <div class="language-switcher" role="tablist" aria-label="Language switcher">
            <button type="button" class="lang-btn is-active" data-lang="fr" aria-pressed="true">FR</button>
            <button type="button" class="lang-btn" data-lang="ar" aria-pressed="false">AR</button>
          </div>
        </div>

        <div class="title-block">
          <h1 id="ooredoo-title" class="section-title font-noto-kufi-arabic" data-title>
              اشتراكات <span class="font-rubik">OOREDOO</span>
          </h1>
          <p class="section-subtitle" data-subtitle></p>
        </div>

        <div class="cards-wrap">
          <div class="cards-grid cards-grid--desktop" data-cards-desktop></div>
          <div class="cards-grid cards-grid--mobile" data-cards-mobile></div>
          <div class="slider-dots" data-slider-dots></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
